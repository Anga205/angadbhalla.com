[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Astro emits static HTML, so no adapter or function runtime is needed.
[dev]
  command = "bun run dev"
  targetPort = 4321
  port = 8888

# Unknown paths fall back to the home page rather than Netlify's default 404.
[[redirects]]
  from = "/*"
  to = "/"
  status = 404
